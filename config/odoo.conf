[options]
; Configuración para desarrollo local y CI (no usar tal cual en producción).
; La conexión a PostgreSQL llega por variables de entorno (PGHOST, PGPORT,
; PGUSER, PGPASSWORD y PGDATABASE), definidas en docker-compose.yml.
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo

; Odoo 20 escucha por defecto solo en 127.0.0.1; dentro del contenedor hay que
; abrirlo a todas las interfaces para que funcione el puerto publicado.
http_interface = 0.0.0.0

; Se trabaja con una única base (PGDATABASE), así que se deshabilita el gestor
; de bases de datos. Con una sola base visible, las llamadas a la API REST no
; necesitan indicar a qué base van dirigidas.
list_db = False
